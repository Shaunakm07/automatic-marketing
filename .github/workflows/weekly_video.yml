name: Weekly Higgsfield Video

on:
  schedule:
    - cron: '0 12 * * 1'   # Monday 12 PM UTC (after research pipeline runs)
  workflow_dispatch:
    inputs:
      wait_for_completion:
        description: 'Poll Higgsfield until video is ready'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate video
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          HIGGSFIELD_API_KEY:         ${{ secrets.HIGGSFIELD_API_KEY }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN:               ${{ secrets.GH_PAT }}
          BRAIN_LLM_REPO:             Shaunakm07/Brain-LLM-Fine-Tuning
          LINKEDIN_ACCESS_TOKEN:      ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:        ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          WAIT_FLAG=""
          if [ "${{ github.event.inputs.wait_for_completion }}" = "true" ]; then
            WAIT_FLAG="--wait"
          fi
          python -m pipelines.weekly_video $WAIT_FLAG
